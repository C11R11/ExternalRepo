name: Compliance Reporting

on:
  workflow_run:
    workflows: ["use action"] # MUST match the 'name' in a workflow
    types:
      - completed

jobs:
  analyze-compliance:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Download Artifact from Parent
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4 pinned
        with:
          name: compliance-data
          # This is the "magic" input for workflow_run
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: parent-reports

      - name: Process Reports
        run: |
          echo "### 🛡️ Security Analysis Summary" >> $GITHUB_STEP_SUMMARY
          cat parent-reports/sast.txt >> $GITHUB_STEP_SUMMARY
          cat parent-reports/sca.txt >> $GITHUB_STEP_SUMMARY