name: Compliance Reporting

on:
  workflow_run:
    workflows: ["use caching"] # MUST match the 'name' in a workflow
    types:
      - completed

jobs:
  analyze-compliance:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Download Artifact from Parent
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: compliance-data
          # This is the "magic" input for workflow_run
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: parent-reports

      - name: Process Reports
        run: |
          echo "### 🛡️ Security Analysis Summary" >> $GITHUB_STEP_SUMMARY
          cat parent-reports/sast.txt >> $GITHUB_STEP_SUMMARY
          cat parent-reports/sca.txt >> $GITHUB_STEP_SUMMARY