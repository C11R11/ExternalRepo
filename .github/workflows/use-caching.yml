name: use action
on: [workflow_dispatch] # workflow_dispatch allows manual triggers in the UI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Smart Setup
        # Use the SHA pinned by Dependabot
        uses: cert-labs-hq/automations-repo/.github/actions/smart-setup@a1b2c3d4e5f6...
        with:
          node-version: '24'

      - name: Build
        run: npm run build