name: use caching
on: [workflow_dispatch] # workflow_dispatch allows manual triggers in the UI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        # actions/checkout@v4
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Run Smart Setup
        # Use the SHA pinned by Dependabot
        uses: cert-labs-hq/automations-repo/.github/actions/setup@841234a2ab0cd482b18c9e36caa189d5bb264c95
        with:
          node-version: '24'

      - name: Build
        run: npm run build

    # Simulate generating reports (SAST, SCA, Tests) 
      - name: Generate Reports. 
        run: |
            mkdir -p reports
            echo "SAST: No vulnerabilities found" > reports/sast.txt
            echo "SCA: 0 high risks" > reports/sca.txt

      - name: Upload Compliance Artifacts
        uses: actions/upload-artifact@4cedc5d8fe50892a5d5b1ee27a6579222d061763 # v4 pinned
        with:
            name: compliance-data
            path: reports/
            retention-days: 1 # Keep it short for ephemeral reports