name: use action
on: [workflow_dispatch] # workflow_dispatch allows manual triggers in the UI

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd 

    - name: Run our custom action
      id: versioning # You need an ID to capture outputs
      uses: cert-labs-hq/automations-repo/.github/actions/get-version@785e05c54dec33f4dec584a5d9fcbc453ac07d66

    # Simulate generating reports (SAST, SCA, Tests)
    - name: Generate Reports
      run: |
        mkdir -p reports
        echo "SAST: No vulnerabilities found" > reports/sast.txt
        echo "SCA: 0 high risks" > reports/sca.txt

    - name: Upload Compliance Artifacts
      uses: actions/upload-artifact@4cedc5d8fe50892a5d5b1ee27a6579222d061763 # v4 pinned
      with:
        name: compliance-data
        path: reports/
        retention-days: 1 # Keep it short for ephemeral reports